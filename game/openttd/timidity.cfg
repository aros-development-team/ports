# SDL2_mixer's built-in timidity reads its config from PROGDIR: on AROS, so
# this has to sit next to the OpenTTD binary. Points at the patch set the
# freepats port installs. Replace with your own "dir"/"source" lines to use a
# different instrument set.
dir Extras:MultiMedia/Audio/Timidity/Freepats
source Extras:MultiMedia/Audio/Timidity/Freepats/freepats.cfg
