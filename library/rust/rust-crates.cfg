# Rust crates patched for AROS, for ports built with cargo.
#
# Each directory here fetches one crate from crates.io and patches it into
# RUST_CRATES_DIR, or holds a crate written for AROS. A port names the ones
# its Cargo.lock uses in the [patch.crates-io] section of its cargo config.
# Several versions of a crate can live side by side: one diff each, each
# unpacked into its own <name>-<version> directory.

RUST_CRATES_DIR    := $(PORTSDIR)/rust-crates
RUST_CRATES_ORIGIN := https://static.crates.io/crates
RUST_CRATES_SRCDIR := $(SRCDIR)/ports/library/rust

# %fetch patches a tree only once, and looks for the diff in the destination
# before the source tree, so an edited diff would silently not apply. This
# drops the unpacked tree, its stamps and the copied diff when the diff in
# the source tree is newer than the stamp, so the fetch starts afresh.
#   $(call RUST_REFRESH,<destination>,<archive file>,<unpacked dir>,<diff>)
RUST_REFRESH = if $(TEST) -f "$(1)/.$(4).applied" && \
        $(TEST) "$(SRCDIR)/$(CURDIR)/$(4)" -nt "$(1)/.$(4).applied" ; then \
        $(ECHO) "Refreshing $(3)" ; \
        $(RM) "$(1)/$(3)" "$(1)/.$(2).unpacked" "$(1)/.$(4).applied" "$(1)/$(4)" ; \
    fi
